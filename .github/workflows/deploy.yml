name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  K8S_NAMESPACE: cs-25-sw-5-06

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set image tag
        id: image
        run: |
          ACTOR_LOWER=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=${{ env.REGISTRY }}/${ACTOR_LOWER}/attribute-prediction:latest" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ steps.image.outputs.tag }} .
          docker push ${{ steps.image.outputs.tag }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    permissions:
      contents: read
    env:
      IMAGE: ${{ needs.build-and-push.outputs.image_tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check permissions
        run: |
          kubectl auth whoami
          kubectl auth can-i update deployments -n "${{ env.K8S_NAMESPACE }}"

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/deployment.yaml -n "${{ env.K8S_NAMESPACE }}"
          kubectl apply -f k8s/service.yaml -n "${{ env.K8S_NAMESPACE }}"

      - name: Update deployment image
        run: |
          kubectl set image deployment/attribute-prediction attribute-prediction="${IMAGE}" -n "${{ env.K8S_NAMESPACE }}"
          kubectl rollout status deployment/attribute-prediction -n "${{ env.K8S_NAMESPACE }}" --timeout=10m

      - name: Create deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "Image built and pushed: \`${IMAGE}\`" >> $GITHUB_STEP_SUMMARY
          echo "Deployed to namespace: \`${{ env.K8S_NAMESPACE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Rollout completed successfully" >> $GITHUB_STEP_SUMMARY
